[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grace"
version = "1.0.0"
description = "Graph-conditioned meta-optimization of cognitive state for knowledge tracing"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "tqdm>=4.64",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
grace = "grace.runner:main"

[tool.setuptools]
packages = ["grace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
