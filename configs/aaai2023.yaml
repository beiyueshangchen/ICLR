# GRACE on the AAAI 2023 Global Knowledge Tracing Challenge data (TAL Education /
# Peiyou, released publicly as XES3G5M; question level, 7453 questions, 859 concepts).
# Usage: python -m grace --config ./configs/aaai2023.yaml
#
# This dataset is not redistributed with the code; download it from its original
# provider and point GRACE at it through the environment, either as
#   export GRACE_AAAI2023_ROOT=/path/to/aaai2023
# or as
#   export GRACE_DATA_ROOT=/path/to/datasets
#      (with an aaai2023/, peiyou/ or xes3g5m/ sub-directory)

dataset: aaai2023
# dataset_root: /path/to/aaai2023
# data_root: /path/to/datasets
# fold: 0            # the challenge ships several folds; 0 is the default

output_dir: runs
seed: 3407
max_seq_len: 100

epochs: 100
lr: 1.0e-3
batch_size: 1
optimizer: adam
weight_decay: 0.0
betas: [0.9, 0.999]
grad_clip: 0.0

concept_emb_dim: 32
item_emb_dim: 32
rank: 4

alpha: 1.0
lambda_1: 0.6
lambda_2: 0.4

eval_every: 1
early_stop_patience: 10
# "val"  -> checkpoint chosen by validation AUC (default, recommended)
# "test" -> checkpoint chosen by test AUC
model_selection: val

ablations: []
